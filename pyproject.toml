[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freeimagetovideo"
version = "0.1.0"
description = "Free image to video AI with no daily cap: start with no sign-up, keep going on a free account. Every video comes with sound and no watermark. This is the official Python SDK and CLI for Free Image to Video."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Free Image to Video", email = "support@freeimagetovideo.ai" }]
keywords = ["image-to-video", "text-to-video", "ai-video", "video-generation", "photo-to-video", "minimax", "freeimagetovideo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://freeimagetovideo.ai/?utm_source=pypi&utm_medium=package"
"Image to video with sound" = "https://freeimagetovideo.ai/video/image-to-video-ai-with-sound"
"API keys" = "https://freeimagetovideo.ai/settings/apikeys"
Documentation = "https://freeimagetovideo.readthedocs.io/"
Source = "https://github.com/hanshs474/fitv-py"

[project.scripts]
freeimagetovideo = "freeimagetovideo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
